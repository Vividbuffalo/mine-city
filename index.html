<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EARTH</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#b9d6ea">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="topbar">
  <div class="brand" id="brand">EARTH</div>
  <div class="stat" title="Money">💰<span id="s-money">0</span></div>
  <div class="stat" title="Population">👥<span id="s-pop">0</span></div>
  <div class="stat" title="Happiness">🙂<span id="s-happy">0</span></div>
  <div class="stat era" title="Era">🏺<span id="s-era"></span></div>
  <div class="stat date" id="s-date" title="Date (1 game hour = 1 second at 1x)"></div>
  <div class="speeds"><button id="sp-pause" title="Pause / play (0)">⏸</button><button id="sp-speed" title="Game speed (1–6)">1x</button></div>
  <div class="stat fps hidden" id="s-fps"></div>
</div>
<div id="status"><div id="st-head"><button id="st-tog" title="Show / hide status bars">▾</button><span id="st-pop" title="Population"></span><span id="st-cycle" title="15 s report cycle"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" class="bg"/><circle id="st-ring" cx="9" cy="9" r="7" class="fg"/></svg><b id="st-cd">15</b></span></div><div id="st-bars"></div><div id="st-goal"></div></div>
<div id="pbars"></div>
<button id="btn-idle" class="hidden" title="Select the next idle villager"></button>
<button id="btn-menu" title="Menu">☰</button>
<div id="menu" class="hidden">
  <button data-panel="tech"><i>🔬</i>Research</button>
  <button data-panel="stats"><i>📊</i>Town & resources</button>
  <button data-panel="log"><i>📜</i>Event log</button>
  <button id="m-help"><i>⌨️</i>Controls</button>
  <hr>
  <button id="btn-save"><i>💾</i>Save</button>
  <button id="btn-load"><i>📂</i>Load</button>
  <button id="btn-export"><i>⬇️</i>Export file</button>
  <button id="btn-import"><i>⬆️</i>Import file</button>
  <button data-panel="newgame"><i>✨</i>New game</button>
  <hr>
  <label class="mrow"><i>🎨</i>Graphics <select id="q-sel"></select></label>
  <button data-panel="dev" id="m-dev" class="hidden"><i>🛠️</i>Dev tools</button>
  <input type="file" id="file-import" accept=".json" class="hidden">
</div>
<div id="toolbar">
  <button data-tool="select" data-tip="Select">🔍<span>Select</span></button>
  <button data-tool="build" data-tip="Build">🏠<span>Build</span></button>
  <button data-tool="road" data-tip="Road (2 money / tile)">🛤️<span>Road</span></button>
  <button data-tool="plant" data-tip="Plant trees">🌱<span>Plant</span></button>
  <button data-tool="scout" data-tip="Units">🚶<span>Units</span></button>
  <button data-tool="survey" data-tip="Survey">🧭<span>Survey</span></button>
  <button data-tool="level" data-tip="Level / terrace">⛰️<span>Level</span></button>
  <button data-tool="dismantle" data-tip="Dismantle">🪓<span>Dismantle</span></button>
  <button id="btn-under" data-tip="Underground view (U)">⛏️<span>Under</span></button>
</div>
<div id="viewctl"><button id="btn-help" title="Controls (?)">⌨️</button><button id="rot-l" title="Rotate view (Q)">⟲</button><button id="rot-r" title="Rotate view (E)">⟳</button></div>
<div id="placing" class="hidden"><img id="pl-img" alt=""><span id="pl-name"></span><button id="pl-rot" title="Rotate building (R)">↻</button><button id="pl-menu" title="Choose another">☰</button><button class="x" id="pl-x" title="Cancel (Esc)">✕</button></div>
<div id="legend" class="sheet hidden"><div class="sh-head"><b>Controls</b><button class="x" id="lg-close">✕</button></div><div id="legend-body"></div></div>
<div id="selbox" class="hidden"></div>
<div id="tip" class="hidden"></div>
<div id="ulegend" class="hidden"></div><div id="utip" class="hidden"></div>
<div id="buildmenu" class="sheet hidden">
  <div class="sh-head"><b>Build</b><span id="bm-res" class="res"></span><button class="x" id="bm-fold">▾</button><button class="x" id="bm-close">✕</button></div>
  <div id="bm-cats"></div><div id="bm-items"></div>
</div>
<div id="info" class="sheet hidden"></div>
<div id="panel" class="sheet hidden"><div class="sh-head"><b id="panel-title"></b><button class="x" id="panel-close">✕</button></div><div id="panel-body"></div></div>
<div id="toasts"></div>
<div id="title">
  <div class="t-card">
    <div class="t-logo">EARTH</div>
    <div class="t-line">Welcome to Earth. Enjoy the journey.</div>
    <div class="t-btns">
      <button id="t-play" class="primary">New game</button>
      <button id="t-cont">Continue</button>
      <button id="t-sand">Sandbox</button>
    </div>
    <label class="t-q">Start era <select id="t-era"></select></label>
    <label class="t-q">Graphics <select id="t-q"></select></label>
    <div class="t-foot">Early build · single-player</div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>

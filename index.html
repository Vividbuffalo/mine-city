<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mine City (MVP)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="topbar">
  <div class="brand">Mine City</div>
  <div class="stat" title="Money">💰 <span id="s-money">0</span></div>
  <div class="stat" title="Population">👥 <span id="s-pop">0</span></div>
  <div class="stat" title="Happiness">🙂 <span id="s-happy">0</span></div>
  <div class="stat" title="Era">🏺 <span id="s-era"></span></div>
  <div class="stat" id="s-date"></div>
  <div class="speeds" id="speeds"></div>
  <div class="res" id="s-res"></div>
</div>
<div id="toolbar">
  <button data-tool="select" title="Select / inspect (Esc)">🔍<span>Select</span></button>
  <button data-tool="road" title="Dirt road (drag) – 2 money/tile">🛤️<span>Road</span></button>
  <button data-tool="build" title="Build menu">🏠<span>Build</span></button>
  <button data-tool="survey" title="Survey (15 money, 12 h, radius 4)">🧭<span>Survey</span></button>
  <button data-tool="block" title="Block build (B)">🧱<span>Blocks</span></button>
  <button data-tool="bulldoze" title="Bulldoze">🚜<span>Bulldoze</span></button>
  <button id="btn-under" title="Underground view (U)">⛏️<span>Under</span></button>
</div>
<div id="buildmenu" class="hidden"><div id="bm-cats"></div><div id="bm-items"></div></div>
<div id="blockbar" class="hidden">
  <div id="bb-mats"></div>
  <select id="bb-func"></select>
  <button id="bb-commit">Build it</button>
  <button id="bb-clear">Clear</button>
  <div id="bb-cost"></div>
  <div class="bb-help">Click: add block · Shift-click: remove top block</div>
</div>
<div id="topright">
  <button data-panel="tech">Tech</button><button data-panel="stats">Stats</button><button data-panel="log">Log</button>
  <button id="btn-save">Save</button><button id="btn-load">Load</button><button id="btn-export">Export</button><button id="btn-import">Import</button>
  <button data-panel="newgame">New</button><button data-panel="dev" class="dev">Dev</button>
  <input type="file" id="file-import" accept=".json" class="hidden">
</div>
<div id="info" class="hidden"></div>
<div id="panel" class="hidden"><div class="ph"><span id="panel-title"></span><button id="panel-close">✕</button></div><div id="panel-body"></div></div>
<div id="eventline"></div>
<div id="toast"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
